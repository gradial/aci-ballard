<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Ballard wordmark</title>
  <desc id="desc">The Ballard wordmark with the phrase Gear that earns its keep and the founding year 1963.</desc>
  <text x="600" y="145" fill="#A84A28" text-anchor="middle" font-family="Roboto Slab, Rockwell, Georgia, serif" font-size="150" font-weight="700" letter-spacing="5" textLength="980" lengthAdjust="spacingAndGlyphs">BALLARD</text>
  <text x="600" y="215" fill="#203A2D" text-anchor="middle" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="5" textLength="680" lengthAdjust="spacingAndGlyphs">GEAR THAT EARNS ITS KEEP.</text>
  <circle cx="535" cy="262" r="5" fill="#A84A28"/>
  <text x="600" y="274" fill="#A84A28" text-anchor="middle" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="4">1963</text>
  <circle cx="665" cy="262" r="5" fill="#A84A28"/>
</svg>
